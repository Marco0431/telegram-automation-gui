name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Python 3.12 / Linux Tk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tk and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-tk xvfb xauth

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline tests with a virtual display
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24"
          python -m unittest discover -s tests -v

name: Windows portable build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**.py"
      - "requirements*.txt"
      - "packaging/**"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "**.py"
      - "requirements*.txt"
      - "packaging/**"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Windows file version (for example 1.0.0)"
        default: "1.0.0"
        required: true

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 executable
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      PACKAGE_VERSION: ${{ inputs.version || '1.0.0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build environment
        run: python -m pip install -r requirements-build.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Build and inspect standalone executable
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:PACKAGE_VERSION = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          python scripts/build_windows.py --version "$env:PACKAGE_VERSION"
      - name: Upload executable only
        uses: actions/upload-artifact@v7
        with:
          name: TelegramAutomation-Windows-x64
          path: dist/TelegramAutomation-Windows-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
